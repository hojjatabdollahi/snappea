[workspace]
members = ["snappea", "snappea-edit"]
resolver = "3"

[workspace.package]
edition = "2024"
authors = ["Hojjat Abdollahi"]
license = "GPL-3.0-only"
repository = "https://github.com/hojjatabdollahi/snappea"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
too_many_lines = "allow"
default_trait_access = "allow"

[workspace.lints.rust]
unused = { level = "warn", priority = -1 }
dead_code = "warn"

[profile.release-with-debug]
inherits = "release"
debug = true

# TODO: upstream these
[patch."https://github.com/wash2/iced_video_player.git"]
iced_video_player = { git = "https://github.com/hojjatabdollahi/iced_video_player.git", branch = "hojjat/fix-size" }

[patch."https://github.com/pop-os/cosmic-viewer.git"]
viewer-tools = { git = "https://github.com/hojjatabdollahi/cosmic-viewer.git", branch = "viewer-tools/shared-annotate-api" }
viewer-widgets = { git = "https://github.com/hojjatabdollahi/cosmic-viewer.git", branch = "viewer-tools/shared-annotate-api" }
