[workspace]
members = ["cosmic-x", "cosmic-x-trim"]
resolver = "3"

[workspace.package]
edition = "2024"
authors = ["Hojjat Abdollahi"]
license = "GPL-3.0-only"
repository = "https://github.com/pop-os/cosmic-x"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Geometry code converts between logical, pixel and f32 coordinates everywhere.
# cast_possible_truncation = "allow"
# cast_possible_wrap = "allow"
# # cast_precision_loss = "allow"
# cast_sign_loss = "allow"
# # Presets are exact floats compared to themselves.
# float_cmp = "allow"
# similar_names = "allow"
# struct_excessive_bools = "allow"
too_many_lines = "allow"
# # Style lints whose fixes would not make this code clearer.
# assigning_clones = "allow"
# default_trait_access = "allow"
# fn_params_excessive_bools = "allow"
# items_after_statements = "allow"
# large_enum_variant = "allow"
# many_single_char_names = "allow"
# match_same_arms = "allow"
# needless_pass_by_value = "allow"
# option_if_let_else = "allow"
# significant_drop_tightening = "allow"
# struct_field_names = "allow"
# too_many_arguments = "allow"
# # zbus interface methods are async by protocol, and its macro references every parameter.
# unused_async = "allow"
# unused_async_trait_impl = "allow"
# used_underscore_binding = "allow"
# while_float = "allow"
# branches_sharing_code = "allow"
# format_collect = "allow"
# match_wildcard_for_single_variants = "allow"
# needless_collect = "allow"
# type_complexity = "allow"
# unnecessary_wraps = "allow"
# useless_let_if_seq = "allow"
#
[workspace.lints.rust]
unused = { level = "warn", priority = -1 }
dead_code = "warn"

[profile.release-with-debug]
inherits = "release"
debug = true

# [patch."https://github.com/pop-os/cosmic-protocols"]
# cosmic-protocols = { path = "../cosmic-protocols" }
# cosmic-client-toolkit = { path = "../cosmic-protocols/client-toolkit" }

# Local checkouts, pending upstream PRs.
[patch."https://github.com/wash2/iced_video_player.git"]
iced_video_player = { git = "https://github.com/hojjatabdollahi/iced_video_player.git", branch = "hojjat/fix-size" }

# [patch."https://github.com/pop-os/cosmic-viewer.git"]
# viewer-tools = { path = "../cosmic-viewer/viewer-tools" }
# viewer-widgets = { path = "../cosmic-viewer/viewer-widgets" }
[patch."https://github.com/pop-os/cosmic-viewer.git"]
viewer-tools = { git = "https://github.com/hojjatabdollahi/cosmic-viewer.git", branch = "viewer-tools/shared-annotate-api" }
viewer-widgets = { git = "https://github.com/hojjatabdollahi/cosmic-viewer.git", branch = "viewer-tools/shared-annotate-api" }

