[package]
name = "cosmic-x-trim"
version = "0.1.0"
edition.workspace = true
rust-version = "1.93"
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Video trimmer for the COSMIC desktop"

[lints]
workspace = true

[dependencies]
env_logger = "0.11"
libc = "0.2"
log = "0.4"
rfd = "0.17"
tokio = { version = "1", features = ["rt", "sync", "time"] }
url = "2"
i18n-embed = { version = "0.16", features = [
  "fluent-system",
  "desktop-requester",
] }
i18n-embed-fl = "0.10"
rust-embed = "8"

[dependencies.iced_video_player]
git = "https://github.com/wash2/iced_video_player.git"
branch = "iced-rebase"
default-features = false

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
default-features = false
features = ["advanced-shaping", "tokio", "winit", "multi-window"]

[features]
default = ["wgpu", "wayland"]
wgpu = ["iced_video_player/wgpu", "libcosmic/wgpu"]
wayland = ["libcosmic/wayland"]
