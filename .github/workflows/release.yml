name: Release

on:
  push:
    tags:
      - "v*"

  # Cloudsmith config is supplied via GitHub Secrets:
  #   CLOUDSMITH_API_KEY — your Cloudsmith API key

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build .deb and publish to Cloudsmith (${{ matrix.codename }})
    # Build on each release so $auto picks up that release's library package names.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            codename: noble
          - runner: ubuntu-26.04
            codename: resolute
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches Cargo.toml version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(
            awk '
              /^\[package\]/ { in_package = 1; next }
              /^\[/ && in_package { exit }
              in_package && $1 == "version" {
                version = $3
                gsub(/"/, "", version)
                print version
                exit
              }
            ' snappea/Cargo.toml
          )"

          if [ -z "$cargo_version" ]; then
            echo "::error::Could not read package version from snappea/Cargo.toml"
            exit 1
          fi

          if [ "$tag_version" != "$cargo_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${cargo_version}; expected v${cargo_version}"
            exit 1
          fi

      # ── Rust toolchain ─────────────────────────────────────────────────────
      # snappea uses Rust 2024 edition which requires rustc >= 1.85
      - name: Install Rust stable (>= 1.85)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry + build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.codename }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.codename }}-cargo-

      # ── System build dependencies ──────────────────────────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-base \
            libtesseract-dev \
            libleptonica-dev \
            libwayland-dev \
            libgbm-dev \
            libdrm-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libdbus-1-dev

      # ── cargo-deb ──────────────────────────────────────────────────────────
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      # ── Build ──────────────────────────────────────────────────────────────
      - name: Build release binary
        run: cargo build --release --locked

      - name: Build .deb package
        # ~codename keeps file names apart in the GitHub Release and sorts noble < resolute for upgrades
        run: cargo deb -p snappea --no-build --deb-revision "1~${{ matrix.codename }}"
        # --no-build because we already built above; cargo-deb just packages

      - name: Locate .deb file
        id: deb
        run: |
          DEB=$(ls target/debian/*.deb | head -1)
          echo "path=$DEB" >> "$GITHUB_OUTPUT"
          echo "name=$(basename $DEB)" >> "$GITHUB_OUTPUT"

      # ── Upload to GitHub Releases (optional but useful) ────────────────────
      - name: Upload .deb to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.deb.outputs.path }}

      # ── Publish to Cloudsmith ──────────────────────────────────────────────
      - name: Install Cloudsmith CLI
        run: pipx install cloudsmith-cli

      - name: Push .deb to Cloudsmith
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: |
          cloudsmith push deb \
            "cosmetics/snappea/pop/${{ matrix.codename }}" \
            "${{ steps.deb.outputs.path }}"
